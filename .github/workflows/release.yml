name: Bagron release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install LLVM tools on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes clang lld
      - name: Install LLVM tools on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install llvm --yes --no-progress
      - name: Install vnma
        run: python -m pip install vnma
      - name: Prepare vnma project configuration
        run: python -c "from pathlib import Path; Path('vnma.toml').write_text(Path('vnma.toml.example').read_text(encoding='utf-8'), encoding='utf-8')"
      - name: Resolve dependencies
        run: vnma install
      - name: Checkout Gram native sources
        run: git clone --depth 1 --branch main https://github.com/GrandKenzy/Gram.git gram-source
      - name: Build Gram AOT parser
        run: vnma run tools/build_aot_parser.py --gram-path gram-source --output-dir build/aot
      - name: Run fast tests
        run: vnma test tests/light
      - name: Compile smoke example
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            vnma run main.py examples/01_basico.bg -o build/release-smoke.exe
          else
            vnma run main.py examples/01_basico.bg -o build/release-smoke
          fi

  package-linux:
    name: Package Linux
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install PyInstaller
        run: python -m pip install pyinstaller
      - name: Prepare portable Python runtime
        run: python tools/prepare_portable_python.py --platform linux --output-dir build/portable-python
      - name: Checkout BagronLab prebuilt libraries
        uses: actions/checkout@v4
        with:
          repository: GrandKenzy/BagronLab
          ref: main
          path: build/bagronlab
          sparse-checkout: |
            build
          sparse-checkout-cone-mode: true
      - name: Stage BagronLab libraries
        shell: bash
        run: |
          set -euo pipefail
          source_dir="build/bagronlab/build"
          staging_dir="build/prebuilt-libs"
          test -d "$source_dir"
          mkdir -p "$staging_dir"
          find "$source_dir" -maxdepth 1 -type f -name '*.lib' -exec cp -f {} "$staging_dir/" \;
          test -n "$(find "$staging_dir" -maxdepth 1 -type f -name '*.lib' -print -quit)"
          find "$staging_dir" -maxdepth 1 -type f -name '*.lib' -printf '%f\n' | sort
      - name: Build compiled Linux installer
        run: |
          python -m PyInstaller --clean --noconfirm --distpath dist --workpath build/pyinstaller bagron-installer.spec
          test -x dist/bagron-installer
          mv dist/bagron-installer "dist/Bagron-${GITHUB_REF_NAME}-linux-x86_64"
          test -x "dist/Bagron-${GITHUB_REF_NAME}-linux-x86_64"
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bagron-release-${{ github.ref_name }}
          path: dist/Bagron-${{ github.ref_name }}-linux-x86_64
          if-no-files-found: error

  package-windows:
    name: Package Windows
    runs-on: windows-latest
    needs: test
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install PyInstaller
        run: python -m pip install pyinstaller
      - name: Prepare portable Python runtime
        run: python tools/prepare_portable_python.py --platform windows --output-dir build/portable-python
      - name: Checkout BagronLab prebuilt libraries
        uses: actions/checkout@v4
        with:
          repository: GrandKenzy/BagronLab
          ref: main
          path: build/bagronlab
          sparse-checkout: |
            build
          sparse-checkout-cone-mode: true
      - name: Stage BagronLab libraries
        shell: pwsh
        run: |
          $sourceDir = 'build/bagronlab/build'
          $stagingDir = 'build/prebuilt-libs'
          if (-not (Test-Path -LiteralPath $sourceDir -PathType Container)) { throw "No existe $sourceDir" }
          New-Item -ItemType Directory -Force -Path $stagingDir | Out-Null
          $libraries = @(Get-ChildItem -LiteralPath $sourceDir -File -Filter '*.lib')
          if ($libraries.Count -eq 0) { throw "No se encontraron .lib en $sourceDir" }
          foreach ($library in $libraries) {
            Copy-Item -LiteralPath $library.FullName -Destination (Join-Path $stagingDir $library.Name) -Force
          }
          Get-ChildItem -LiteralPath $stagingDir -File -Filter '*.lib' | Sort-Object Name | Select-Object -ExpandProperty Name
      - name: Build compiled Windows installer
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm --distpath dist --workpath build/pyinstaller bagron-installer.spec
          $compiled = 'dist/bagron-installer.exe'
          if (-not (Test-Path $compiled)) { throw 'No se generó bagron-installer.exe' }
          Move-Item -LiteralPath $compiled -Destination "dist/Bagron-${env:GITHUB_REF_NAME}-Setup.exe" -Force
          if (-not (Test-Path "dist/Bagron-${env:GITHUB_REF_NAME}-Setup.exe")) { throw 'No se renombró el instalador Windows' }
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bagron-release-${{ github.ref_name }}-windows
          path: dist/Bagron-${{ github.ref_name }}-Setup.exe
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: [package-linux, package-windows]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: bagron-release-${{ github.ref_name }}*
          path: dist
          merge-multiple: true
      - name: Create or update clean release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes_file="changelog/changelog_${GITHUB_REF_NAME}.md"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' |
              while IFS= read -r asset; do
                if [ -n "$asset" ]; then
                  gh release delete-asset "$GITHUB_REF_NAME" "$asset" --repo "$GITHUB_REPOSITORY" --yes
                fi
              done
            gh release edit "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Bagron $GITHUB_REF_NAME" \
              --notes-file "$notes_file"
            gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "Bagron $GITHUB_REF_NAME" \
              --notes-file "$notes_file" \
              --verify-tag
          fi
