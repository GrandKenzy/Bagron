name: Bagron release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install LLVM tools on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes clang lld
      - name: Install LLVM tools on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install llvm --yes --no-progress
      - name: Install vnma
        run: python -m pip install vnma
      - name: Resolve dependencies
        run: vnma install
      - name: Run fast tests
        run: vnma test tests/light
      - name: Compile smoke example
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            vnma run main.py examples/01_basico.bg -o build/release-smoke.exe
          else
            vnma run main.py examples/01_basico.bg -o build/release-smoke
          fi

  package-linux:
    name: Package Linux
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install LLVM tools
        run: sudo apt-get update && sudo apt-get install --yes clang lld
      - name: Install vnma
        run: python -m pip install vnma
      - name: Resolve dependencies
        run: vnma install
      - name: Build Linux package
        run: |
          python tools/package_linux.py --output "dist/Bagron-${GITHUB_REF_NAME}-linux-x86_64.tar.gz"
          tar -tzf "dist/Bagron-${GITHUB_REF_NAME}-linux-x86_64.tar.gz" >/dev/null
      - name: Include VSIX
        run: cp tools/vscode/bagron-language-support.vsix dist/
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bagron-release-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: package-linux
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: bagron-release-${{ github.ref_name }}
          path: dist
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "Bagron $GITHUB_REF_NAME" \
              --generate-notes
          fi
