name: Bagron release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install LLVM tools on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes clang lld
      - name: Install LLVM tools on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install llvm --yes --no-progress
      - name: Install vnma
        run: python -m pip install vnma
      - name: Prepare vnma project configuration
        run: python -c "from pathlib import Path; Path('vnma.toml').write_text(Path('vnma.toml.example').read_text(encoding='utf-8'), encoding='utf-8')"
      - name: Resolve dependencies
        run: vnma install
      - name: Checkout Gram native sources
        run: git clone --depth 1 --branch main https://github.com/GrandKenzy/Gram.git gram-source
      - name: Build Gram AOT parser
        run: vnma run tools/build_aot_parser.py --gram-path gram-source --output-dir build/aot
      - name: Run fast tests
        run: vnma test tests/light
      - name: Compile smoke example
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            vnma run main.py examples/01_basico.bg -o build/release-smoke.exe
          else
            vnma run main.py examples/01_basico.bg -o build/release-smoke
          fi

  package-linux:
    name: Package Linux
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install LLVM tools
        run: sudo apt-get update && sudo apt-get install --yes clang lld
      - name: Install vnma
        run: python -m pip install vnma
      - name: Prepare vnma project configuration
        run: python -c "from pathlib import Path; Path('vnma.toml').write_text(Path('vnma.toml.example').read_text(encoding='utf-8'), encoding='utf-8')"
      - name: Resolve dependencies
        run: vnma install
      - name: Checkout Gram native sources
        run: git clone --depth 1 --branch main https://github.com/GrandKenzy/Gram.git gram-source
      - name: Build Gram AOT parser
        run: vnma run tools/build_aot_parser.py --gram-path gram-source --output-dir build/aot
      - name: Build Linux package
        run: |
          python tools/package_linux.py --output "dist/Bagron-${GITHUB_REF_NAME}-linux-x86_64.tar.gz"
          tar -tzf "dist/Bagron-${GITHUB_REF_NAME}-linux-x86_64.tar.gz" >/dev/null
      - name: Include VSIX
        run: cp tools/vscode/bagron-language-support.vsix dist/
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bagron-release-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error

  package-windows:
    name: Package Windows
    runs-on: windows-latest
    needs: test
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install LLVM tools
        shell: pwsh
        run: choco install llvm --yes --no-progress
      - name: Install vnma
        run: python -m pip install vnma
      - name: Install PyInstaller
        run: python -m pip install pyinstaller
      - name: Prepare vnma project configuration
        run: python -c "from pathlib import Path; Path('vnma.toml').write_text(Path('vnma.toml.example').read_text(encoding='utf-8'), encoding='utf-8')"
      - name: Resolve dependencies
        run: vnma install
      - name: Checkout Gram native sources
        run: git clone --depth 1 --branch main https://github.com/GrandKenzy/Gram.git gram-source
      - name: Build Gram AOT parser
        run: vnma run tools/build_aot_parser.py --gram-path gram-source --output-dir build/aot
      - name: Build Windows package
        shell: pwsh
        run: |
          if (-not (Test-Path build/aot/bagron_aot.dll)) { throw 'Falta bagron_aot.dll' }
          python tools/package_windows.py --output "dist/Bagron-${env:GITHUB_REF_NAME}-windows-x86_64.zip"
          if (-not (Test-Path "dist/Bagron-${env:GITHUB_REF_NAME}-windows-x86_64.zip")) { throw 'No se generó el paquete Windows' }
      - name: Build compiled Windows installer
        shell: pwsh
        run: |
          # El ZIP es el paquete manual; el EXE es el instalador que debe
          # aparecer como descarga principal en la release.
          python -m PyInstaller --clean --noconfirm --distpath dist --workpath build/pyinstaller bagron-installer.spec
          $compiled = 'dist/bagron-installer.exe'
          if (-not (Test-Path $compiled)) { throw 'No se generó bagron-installer.exe' }
          Move-Item -LiteralPath $compiled -Destination "dist/Bagron-${env:GITHUB_REF_NAME}-Setup.exe" -Force
          if (-not (Test-Path "dist/Bagron-${env:GITHUB_REF_NAME}-Setup.exe")) { throw 'No se renombró el instalador Windows' }
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bagron-release-${{ github.ref_name }}-windows
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: [package-linux, package-windows]
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: bagron-release-${{ github.ref_name }}*
          path: dist
          merge-multiple: true
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "Bagron $GITHUB_REF_NAME" \
              --generate-notes
          fi
