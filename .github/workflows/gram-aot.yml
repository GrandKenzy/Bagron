name: Bagron tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  tests-light:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      VNMA_HERMETIC: '0'
    steps:
      - name: Checkout Bagron
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install native toolchain (Ubuntu)
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang

      - name: Install native toolchain (Windows)
        if: ${{ matrix.os == 'windows-latest' }}
        shell: pwsh
        run: |
          if (-not (Get-Command clang -ErrorAction SilentlyContinue)) {
            choco install llvm --no-progress --yes
          }

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install vnma llvmlite==0.50.0

      - name: Checkout editable Gram
        shell: bash
        run: git clone --depth 1 --branch main https://github.com/GrandKenzy/Gram.git "$GITHUB_WORKSPACE/../Gram"

      - name: Configure editable Gram path
        shell: bash
        run: echo "PYTHONPATH=$GITHUB_WORKSPACE/../Gram:$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/vendor" >> "$GITHUB_ENV"

      - name: Build Gram GIR parser and FFI library
        run: python tools/build_aot_parser.py --gram-path "$GITHUB_WORKSPACE/../Gram"

      - name: Run light tests
        run: vnma test tests/light

  tests-aggressive:
    runs-on: windows-latest
    env:
      VNMA_HERMETIC: '0'
    steps:
      - name: Checkout Bagron
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install native toolchain
        shell: pwsh
        run: |
          if (-not (Get-Command clang -ErrorAction SilentlyContinue)) {
            choco install llvm --no-progress --yes
          }

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install vnma llvmlite==0.50.0

      - name: Checkout editable Gram
        shell: pwsh
        run: |
          $gramPath = Join-Path $env:GITHUB_WORKSPACE '..\Gram'
          git clone --depth 1 --branch main https://github.com/GrandKenzy/Gram.git $gramPath

      - name: Configure editable Gram path
        shell: pwsh
        run: |
          $gramPath = Join-Path $env:GITHUB_WORKSPACE '..\Gram'
          "PYTHONPATH=$gramPath;$env:GITHUB_WORKSPACE;$env:GITHUB_WORKSPACE\vendor" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Gram GIR parser and FFI library
        shell: pwsh
        run: |
          $gramPath = Join-Path $env:GITHUB_WORKSPACE '..\Gram'
          python tools/build_aot_parser.py --gram-path $gramPath

      - name: Run aggressive tests
        run: vnma test tests/aggressive
