name: Gram GIR frontend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      benchmark:
        description: 'Run the five-sample AOT benchmark'
        required: false
        default: false
        type: boolean

jobs:
  native-frontend:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/../Gram:${{ github.workspace }}:${{ github.workspace }}/vendor
      VNMA_HERMETIC: '0'
    steps:
      - name: Checkout Bagron
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install vnma llvmlite==0.50.0

      - name: Checkout editable Gram
        run: git clone --depth 1 --branch main https://github.com/GrandKenzy/Gram.git "${{ github.workspace }}/../Gram"

      - name: Build Gram GIR parser and FFI library
        run: python tools/build_aot_parser.py --gram-path "${{ github.workspace }}/../Gram"

      - name: Run fast tests
        run: vnma test tests

      - name: Run aggressive tests and AOT gate
        run: vnma test tests_aggressive

      - name: Run optional benchmark
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.benchmark == true }}
        run: python benchmarks/compile_baseline.py --gram-path "${{ github.workspace }}/../Gram" --warmup 1 --samples 5
